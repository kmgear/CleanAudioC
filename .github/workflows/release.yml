name: Publish Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Publish self-contained executable
        run: >-
          dotnet publish CleanAudioC.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:PublishTrimmed=true
          --output publish

      - name: Package published files
        shell: pwsh
        run: |
          Compress-Archive -Path 'publish/*' -DestinationPath 'CleanAudioC-${{ matrix.rid }}.zip' -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanAudioC-${{ matrix.rid }}
          path: CleanAudioC-${{ matrix.rid }}.zip
          if-no-files-found: error

  create-release:
    name: Attach binaries to GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: CleanAudioC-*
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --title "$GITHUB_REF_NAME" --generate-notes
